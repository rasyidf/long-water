<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="/style.css" />
    <title>Long Water - The Game</title>
  </head>

  <body>
    <div id="app"><div id="pixi-container"></div></div>

    <!-- Instant splash: shows on first paint, before the game bundle parses or
         WebGL comes up. The BWDX Studio bumper plays, then the logo lands and
         holds while the ocean loads behind it; src/main.ts drives the progress
         bar and lifts it when the run is ready.
         #splashWord stays empty unless boot fails (it shows the error then). -->
    <div id="splash" class="splash">
      <div class="splash-stage">
        <img src="/logo.png" alt="Long Water" class="splash-logo" />
        <div class="splash-bumper">
          <img src="/bwdx.svg" alt="" />
          <span>BWDX Studio</span>
        </div>
      </div>
      <div class="splash-tail">
        <div class="splash-word" id="splashWord"></div>
        <div class="splash-bar"><i id="splashBar"></i></div>
      </div>
    </div>

    <!-- Fade-to-black cover for an in-place world rebuild (New Game / Continue
         onto a different save / Restart / Exit to title). `menu/FrontEnd.ts`
         drives it; the game never reloads the page after the initial boot. -->
    <div class="curtain" id="curtain"></div>

    <!-- ============================ gameplay HUD ============================
         Hidden (via body[data-screen]) whenever the title or end screen is up;
         the world keeps rendering a frozen frame behind them either way. -->
    <div class="hud topbar">
      <div class="tb-left">
        <svg viewBox="0 0 30 20" class="wave-mark" aria-hidden="true">
          <path d="M1 7C5.5 7 5.5 3 10 3C14.5 3 14.5 7 19 7C23.5 7 23.5 3 28 3" />
          <path d="M1 14C5.5 14 5.5 10 10 10C14.5 10 14.5 14 19 14C23.5 14 23.5 10 28 10" />
        </svg>
        <div class="tb-zone">
          <span id="zoneName">Continental shelf</span>
          <span class="leg" id="leg">0.0 of 12.0 km</span>
        </div>
      </div>

      <div class="tb-mid">
        <div class="compass">
          <span class="pole">S</span>
          <span class="strip"><b id="compassNeedle"></b></span>
          <span class="pole">N</span>
        </div>
        <div class="goal" id="goal">South to warm water. The krill is below the light.</div>
      </div>

      <div class="tb-right">
        <div class="tb-score"><b id="scoreNum">0</b><span>pts</span></div>
        <div class="tb-gauge">
          <svg viewBox="0 0 24 24" class="tb-ico" aria-hidden="true">
            <circle cx="12" cy="12" r="4.4" />
            <g class="rays">
              <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1" />
            </g>
          </svg>
          <span id="clock">08:00</span>
        </div>
        <div class="tb-gauge">
          <svg viewBox="0 0 24 24" class="tb-ico" aria-hidden="true">
            <path d="M10 4.5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0Z" />
            <path d="M12 9v5.2" class="tb-ico-fill" />
          </svg>
          <span id="temp">12°</span>
        </div>
      </div>
    </div>

    <div class="hud instruments">
      <div class="gauges">
        <div class="meter">
          <div class="label"><span>Breath</span><span class="pct" id="breathNum">100%</span></div>
          <div class="track"><div class="fill" id="breathFill"></div></div>
        </div>
        <div class="meter">
          <div class="label"><span>Reserves</span><span class="pct" id="energyNum">100%</span></div>
          <div class="track"><div class="fill" id="energyFill"></div></div>
        </div>
        <div class="pod">
          <span class="pod-mark"></span><span class="pod-label">Pod</span>
          <span class="dots" id="podDots"></span>
          <span class="draft" id="draft"></span>
        </div>
      </div>
    </div>

    <div class="hud hint" id="hint"></div>
    <div class="hud trickpop" id="trickpop"></div>
    <div class="hud ruler"><canvas id="ruler"></canvas></div>

    <!-- opening controls strip: shown a few seconds after a fresh New Game,
         replaces the old title-card ".keys" list -->
    <div class="hud keyhint" id="keyhint"></div>

    <div class="menu" id="menu" hidden>
      <h2>Paused</h2>
      <button type="button" data-act="resume">Resume</button>
      <button type="button" data-act="restart">Restart this leg</button>
      <button type="button" data-act="save">Save</button>
      <button type="button" data-act="load">Load</button>
      <button type="button" data-act="options">Options</button>
      <button type="button" data-act="exit">Exit to title</button>
      <div class="note" id="menuNote"></div>
    </div>

    <!-- ============================ front end ============================ -->

    <!-- title screen: New Game / Continue / Multiplayer (disabled) / Options,
         a trophy shelf, and the almanac entry point -->
    <div class="screen title" id="title">
      <img src="/logo.png" alt="Long Water" class="title-logo" />
      <p class="title-tag">one leg of the migration</p>

      <nav class="title-menu">
        <button type="button" class="tm-btn" data-act="new">
          <span class="lbl">New Game</span>
        </button>
        <button type="button" class="tm-btn" data-act="continue">
          <span class="lbl">Continue</span><small></small>
        </button>
        <button type="button" class="tm-btn" data-act="multiplayer" disabled>
          <span class="lbl">Multiplayer</span><small></small>
        </button>
        <button type="button" class="tm-btn" data-act="options">
          <span class="lbl">Options</span>
        </button>
        <button type="button" class="tm-btn" data-act="almanac">
          <span class="lbl">Almanac</span><small></small>
        </button>
      </nav>

      <button
        type="button"
        class="title-shelf"
        data-act="trophies"
        aria-label="Trophies"
      ></button>
      <p class="title-records"></p>
      <p class="title-note" id="titleNote"></p>
    </div>

    <!-- end-of-run screen: result + tally, then back to title or swim again -->
    <div class="screen end" id="end">
      <h1></h1>
      <p></p>
      <div class="end-finds" hidden>
        <h2></h2>
        <ul></ul>
      </div>
      <div class="end-actions">
        <button type="button" data-act="again"><span class="lbl"></span></button>
        <button type="button" data-act="title"><span class="lbl"></span></button>
      </div>
    </div>

    <!-- shared options panel: opened from the title or the pause menu -->
    <div class="panel options" id="options">
      <h2></h2>
      <div class="opt-row opt-volume">
        <span></span>
        <input type="range" id="optVolume" min="0" max="100" step="1" value="100" />
        <b id="optVolumeNum">100%</b>
      </div>
      <h3></h3>
      <div class="keys"></div>
      <div class="opt-actions">
        <button type="button" class="opt-reset" data-act="reset" hidden></button>
        <button type="button" class="opt-back" data-act="back"></button>
      </div>
    </div>

    <!-- almanac: a field guide (Creatures) and a case of feats (Trophies) -->
    <div class="panel almanac" id="almanac">
      <div class="alm-head">
        <h2></h2>
        <button type="button" class="alm-back" data-act="back"></button>
      </div>
      <div class="alm-tabs">
        <button type="button" data-tab="creatures" aria-selected="true"></button>
        <button type="button" data-tab="trophies" aria-selected="false"></button>
      </div>
      <div class="alm-body">
        <div class="alm-grid" id="almGrid"></div>
        <div class="alm-detail" id="almDetail"></div>
      </div>
    </div>

    <!-- "new in the almanac" popup, queued so overlapping finds don't clobber -->
    <div class="toast" id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
