<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>Long Water / ProcGen Designer</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(6, 12, 22, 0.86);
        --line: rgba(120, 160, 190, 0.18);
        --ink: #d7e6ee;
        --dim: #8fa6b4;
        --accent: #6ec7dc;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #02040a;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ink);
      }
      #pixi-container {
        position: fixed;
        inset: 0;
      }
      #pixi-container canvas {
        display: block;
      }

      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }

      #controls {
        top: 14px;
        left: 14px;
        width: 264px;
        padding: 12px 14px;
      }
      #controls h1 {
        margin: 0 0 2px;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      #controls .sub {
        margin: 0 0 10px;
        color: var(--dim);
        font-size: 11px;
      }
      .ctl {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 2px 8px;
        margin: 7px 0;
      }
      .ctl label {
        color: var(--dim);
      }
      .ctl output {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .ctl input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: var(--accent);
        margin: 0;
      }
      .row {
        display: flex;
        gap: 6px;
        margin: 10px 0 2px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: rgba(110, 199, 220, 0.12);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 5px 9px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(110, 199, 220, 0.22);
      }
      button.on {
        background: var(--accent);
        color: #04121a;
        border-color: var(--accent);
      }

      #layers {
        top: 14px;
        right: 14px;
        width: 210px;
        padding: 10px 12px;
      }
      #layers h2 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .lyr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
      }
      .lyr:hover,
      .lyr.hot {
        background: rgba(110, 199, 220, 0.16);
      }
      .lyr .sw {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--accent);
        flex: none;
      }
      .lyr.off {
        opacity: 0.4;
      }

      #code {
        left: 14px;
        bottom: 14px;
        right: 14px;
        max-width: 720px;
        margin: 0 auto;
        padding: 0;
        max-height: 42vh;
        display: flex;
        flex-direction: column;
      }
      #code header {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        color: var(--dim);
      }
      #code header b {
        color: var(--ink);
      }
      #code pre {
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        font-size: 11px;
        white-space: pre;
        tab-size: 2;
      }
      #code.empty {
        display: none;
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        color: var(--dim);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 5px 10px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pixi-container"></div>

    <div id="controls" class="panel">
      <h1>ProcGen Designer</h1>
      <p class="sub">ProceduralWhaleView — one body, live params</p>
      <div id="sliders"></div>
      <div class="row">
        <button type="button" id="facing">facing ►</button>
        <button type="button" id="swim" class="on">swim</button>
        <button type="button" id="reset">reset</button>
      </div>
    </div>

    <div id="layers" class="panel">
      <h2>Draw sections</h2>
      <div id="layerList"></div>
    </div>

    <div id="code" class="panel empty">
      <header>
        <span><b id="codeName">—</b> · ProceduralWhaleView.ts</span>
        <span id="codeLines"></span>
      </header>
      <pre><code id="codeBody"></code></pre>
    </div>

    <div class="hint" id="hint">hover the whale or a section name</div>

    <script type="module" src="/src/procgen.ts"></script>
  </body>
</html>
